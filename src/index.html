<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <link rel="icon" href="/images/icon-192.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* CSS Reset Sederhana untuk Body */
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #F5F7FA; }
